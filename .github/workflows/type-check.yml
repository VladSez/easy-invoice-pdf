name: 📝 TypeScript Type Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  type-check:
    name: Run type check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # we use pinned versions because there are safer to use: https://x.com/paulmillr/status/1900948425325031448
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: 🛎️ Checkout repository
        with:
          persist-credentials: false

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        name: 🔒 Setup Socket Firewall
        with:
          mode: firewall-free

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        name: 📚 Setup Node.js
        with:
          node-version: lts/*

      - name: 📦 Enable Corepack
        run: corepack enable

      - name: 📦 Install pinned package manager # from package.json
        run: corepack install

      - name: 🚚 Install dependencies
        run: sfw pnpm install --frozen-lockfile # firewall to block malicious packages from being installed https://docs.socket.dev/docs/socket-firewall-overview

      - name: 🔍 Run type check
        id: type-check
        continue-on-error: true
        env:
          # `next typegen` loads next.config.mjs, which validates src/env.ts.
          # Runtime secrets are not needed (and not available) for type checking.
          SKIP_ENV_VALIDATION: "true"
        run: pnpm type-check

      - name: 📧 Send email
        if: steps.type-check.outcome == 'failure'
        # https://github.com/dawidd6/action-send-mail
        uses: dawidd6/action-send-mail@d38f3f7cd391cdebfe0d38efc3998b935e951c4f # v16
        with:
          server_address: smtp.gmail.com
          server_port: 587
          from: "GitHub Actions (no-reply) <${{ secrets.EMAIL_USERNAME }}>"
          to: ${{ secrets.EMAIL_USERNAME }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ❌ Type Check Failed for ${{ github.repository }}
          body: |
            Type check for ${{ github.repository }} has failed.

            For more details, please check:
            - GitHub Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            ${{ github.event.pull_request.html_url && format('- Pull Request: {0}', github.event.pull_request.html_url) }}

      - name: ❌ Mark workflow failed on Type Check failure
        if: steps.type-check.outcome == 'failure'
        run: exit 1
