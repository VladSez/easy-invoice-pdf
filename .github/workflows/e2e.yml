name: 🎭 Playwright E2E tests
on:
  deployment_status:

permissions:
  contents: read
  pull-requests: read

jobs:
  # `deployment_status` carries no branch: Vercel creates deployments with `ref` set to
  # the commit SHA and an empty payload, so `github.ref` and `github.ref_name` are empty.
  # A workflow-level `concurrency: e2e-${{ github.ref }}` therefore put every run in one
  # group, and each new deployment (any branch, any state) cancelled the run in flight.
  # This job resolves the branch from the SHA so the e2e job can group on it, and looks
  # up the PR for the email at the same time.
  resolve:
    # https://vercel.com/guides/how-can-i-run-end-to-end-tests-after-my-vercel-preview-deployment
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    name: Resolve branch and PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      concurrency_key: ${{ steps.resolve.outputs.concurrency_key }}
      pr_url: ${{ steps.resolve.outputs.pr_url }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_title: ${{ steps.resolve.outputs.pr_title }}
    steps:
      # Production (`main`) deploys share one key and skip the PR lookup: a merged PR's
      # commit still maps back to that PR, which would label a `main` run as the PR and
      # group it with that PR's runs. With no PR outputs, the email subject and body
      # fall back to the repository name.
      #
      # Previews use the PR's head branch, then a branch whose head is the SHA (pushed
      # without a PR), and finally the SHA itself, which only means that run cannot be
      # cancelled by a later one.
      - name: 🔍 Resolve branch and PR
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.event.deployment.sha }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
        run: |
          if [ "$ENVIRONMENT" = "Production" ]; then
            echo "concurrency_key=production" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `gh api` prints the error body to stdout on failure, so a failed lookup is reset to empty.
          PR_JSON=$(gh api "repos/$GH_REPOSITORY/commits/$GH_SHA/pulls" --jq '.[0] // empty') || PR_JSON=""
          BRANCH=$(jq -r '.head.ref // empty' <<<"${PR_JSON:-null}")
          if [ -z "$BRANCH" ]; then
            BRANCH=$(gh api "repos/$GH_REPOSITORY/commits/$GH_SHA/branches-where-head" --jq '.[0].name // empty') || BRANCH=""
          fi

          # The title is user-controlled: newlines are stripped so it cannot inject extra outputs.
          {
            echo "concurrency_key=preview-${BRANCH:-$GH_SHA}"
            echo "pr_url=$(jq -r '.html_url // empty' <<<"${PR_JSON:-null}")"
            echo "pr_number=$(jq -r '.number // empty' <<<"${PR_JSON:-null}")"
            echo "pr_title=$(jq -r '.title // empty | gsub("[\\r\\n]"; " ")' <<<"${PR_JSON:-null}")"
          } >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve

    # One run per branch: a new deployment of the same branch cancels the superseded run,
    # while deployments of other branches no longer touch it. See the `resolve` job.
    concurrency:
      group: e2e-${{ needs.resolve.outputs.concurrency_key }}
      cancel-in-progress: true

    name: Run e2e tests via ${{ github.event_name == 'deployment_status' && 'Vercel deployment' }}
    timeout-minutes: 65
    # We pin a macOS runner because the PDF snapshots (screenshots) are generated locally on
    # macOS, so CI has to rasterize on the same OS family to match them.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    #
    # NOT `macos-14`: Playwright freezes WebKit on that image (`revisionOverrides` in
    # `playwright-core/browsers.json` pins mac14/mac14-arm64 to an old revision), so the
    # `Desktop Safari` / `Mobile Safari` projects would silently test a stale engine and
    # every run logs "You are using a frozen webkit browser which does not receive updates
    # anymore on mac14-arm64". `macos-15` gets the current WebKit build.
    #
    # NOT `macos-latest` either - it follows GitHub's newest stable image, and an image bump
    # would invalidate the PDF snapshot baselines without a commit to point at.
    runs-on: macos-15
    env:
      TZ: Europe/Warsaw # we use Europe/Warsaw timezone for consistent date handling across local machines and CI
    steps:
      - name: Echo environment URL
        env:
          ENVIRONMENT_URL: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.environment_url }}
        run: |
          echo "Environment URL - $ENVIRONMENT_URL"
      # we use pinned versions because there are safer to use: https://x.com/paulmillr/status/1900948425325031448
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: 🛎️ Checkout repository
        with:
          persist-credentials: false

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        name: 🔒 Setup Socket Firewall
        with:
          mode: firewall-free

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        name: 📚 Setup Node.js
        with:
          node-version-file: .nvmrc

      - name: 📦 Enable Corepack
        run: corepack enable

      - name: 📦 Install pinned package manager # from package.json
        run: corepack install

      - name: 🚚 Install dependencies
        run: sfw pnpm install --frozen-lockfile # firewall to block malicious packages from being installed https://docs.socket.dev/docs/socket-firewall-overview

      - name: 📦 Install Playwright browser binaries & OS dependencies
        run: pnpm exec playwright install chromium webkit firefox --with-deps

      - name: 🎭 Run Playwright tests
        id: playwright
        env:
          BASE_URL: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.environment_url }}
          # NOTE: Sentry cannot be switched off from here. These tests drive a real
          # Vercel preview deployment, which runs with its own env vars — anything set
          # on this step only reaches the Playwright process. The browser SDK is opted
          # out inside the app instead: `playwright.config.ts` seeds the
          # `sentry.disabled` localStorage key. Server and edge events caused by a run
          # are still reported.
          #
          # Needed by the /api/generate-invoice/preview e2e snapshots. Must match the
          # AUTH_TOKEN of the deployment under test. The preview tests fail when it is
          # unset so CI cannot pass without exercising the authenticated endpoint.
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        continue-on-error: true
        # https://playwright.dev/docs/test-reporters#line-reporter
        run: pnpm exec playwright test --reporter=html,list

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        name: 🎲 Upload Playwright report
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-output/
          if-no-files-found: ignore
          retention-days: 1

      - name: 📧 Send email
        ## always notify; subject/body reflect cancellation vs pass/fail
        if: always()
        uses: ./.github/actions/send-email
        with:
          api-key: ${{ secrets.CI_RESEND_API_KEY }}
          from: ${{ secrets.CI_EMAIL_FROM }}
          to: ${{ secrets.CI_EMAIL_TO }}
          subject: "${{ job.status == 'cancelled' && '⚠️ E2E Tests Cancelled' || (steps.playwright.outcome == 'success' && '✅ E2E Tests Passed' || '❌ E2E Tests Failed') }}${{ needs.resolve.outputs.pr_number && format(' · #{0} {1}', needs.resolve.outputs.pr_number, needs.resolve.outputs.pr_title) || format(' for {0}', github.repository) }}"
          body: |
            E2E tests for ${{ github.repository }} have completed.

            ${{ needs.resolve.outputs.pr_number && format('Pull Request: #{0} {1}', needs.resolve.outputs.pr_number, needs.resolve.outputs.pr_title) }}
            Result: ${{ job.status == 'cancelled' && '⚠️ Cancelled' || (steps.playwright.outcome == 'success' && '✅ Passed' || '❌ Failed') }}

            For more details, please check:
            - GitHub Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            ${{ needs.resolve.outputs.pr_url && format('- Pull Request: {0}', needs.resolve.outputs.pr_url) }}
            - Vercel deployment: ${{ github.event.deployment_status.environment_url }}
          attachments: ${{ job.status != 'cancelled' && 'playwright-output/report/index.html' || '' }}

      - name: ❌ Mark workflow failed on E2E Tests failure
        if: steps.playwright.outcome == 'failure'
        run: exit 1
