name: 🔍 Knip
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  knip:
    name: Run Knip
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # we use pinned versions because there are safer to use: https://x.com/paulmillr/status/1900948425325031448
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: 🛎️ Checkout repository
        with:
          persist-credentials: false

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        name: 🔒 Setup Socket Firewall
        with:
          mode: firewall-free

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        name: 📚 Setup Node.js
        with:
          node-version-file: .nvmrc

      - name: 📦 Enable Corepack
        run: corepack enable

      - name: 📦 Install pinned package manager # from package.json
        run: corepack install

      - name: 🚚 Install dependencies
        run: sfw pnpm install --frozen-lockfile # firewall to block malicious packages from being installed https://docs.socket.dev/docs/socket-firewall-overview

      - name: 🔎 Run Knip
        id: knip
        continue-on-error: true
        run: pnpm knip

      - name: 📣 Notify via Telegram
        if: steps.knip.outcome == 'failure'
        uses: ./.github/actions/notify-telegram
        with:
          bot-token: ${{ secrets.CI_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.CI_TELEGRAM_CHAT_ID }}
          subject: "❌ Knip Failed${{ github.event.pull_request && format(' · #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || format(' for {0}', github.repository) }}"
          body: |
            Knip for ${{ github.repository }} has failed.

            ${{ github.event.pull_request && format('Pull Request: #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) }}

            For more details, please check:
            - GitHub Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            ${{ github.event.pull_request.html_url && format('- Pull Request: {0}', github.event.pull_request.html_url) }}

      - name: ❌ Mark workflow failed on Knip failure
        if: steps.knip.outcome == 'failure'
        run: exit 1
