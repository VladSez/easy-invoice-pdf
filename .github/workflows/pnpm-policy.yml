name: 🔒 pnpm supply-chain policy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pnpm-policy:
    name: Verify pnpm supply-chain config
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # we use pinned versions because there are safer to use: https://x.com/paulmillr/status/1900948425325031448
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: 🛎️ Checkout repository
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        name: 📚 Setup Node.js
        with:
          node-version-file: .nvmrc

      - name: 📦 Enable Corepack
        run: corepack enable

      - name: 📦 Install pinned package manager # from package.json
        run: corepack install

      - name: Verify pnpm supply-chain config
        id: pnpm-policy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          required_pnpm_version="10.16.0"
          actual_pnpm_version="$(pnpm --version)"

          if ! printf '%s\n%s\n' "$required_pnpm_version" "$actual_pnpm_version" | sort -CV; then
            echo "❌ pnpm version must be >= $required_pnpm_version (got $actual_pnpm_version)"
            exit 1
          fi

          echo "✅ pnpm version=$actual_pnpm_version (>= $required_pnpm_version)"

          verify_config() {
            local key="$1"
            local expected="$2"

            local actual
            actual="$(pnpm config get "$key" --location project 2>/dev/null || true)"
            actual="${actual%\"}"
            actual="${actual#\"}"

            if [[ "$actual" != "$expected" ]]; then
              echo "❌ $key mismatch: expected '$expected', got '${actual:-<empty>}'"
              exit 1
            fi

            echo "✅ $key=$actual"
          }

          verify_config minimum-release-age 7200
          verify_config block-exotic-subdeps true

      - name: 📣 Notify via Telegram
        if: steps.pnpm-policy.outcome == 'failure'
        uses: ./.github/actions/notify-telegram
        with:
          bot-token: ${{ secrets.CI_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.CI_TELEGRAM_CHAT_ID }}
          subject: "❌ pnpm Supply-Chain Policy Failed${{ github.event.pull_request && format(' · #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || format(' for {0}', github.repository) }}"
          body: |
            pnpm supply-chain policy verification for ${{ github.repository }} has failed.

            ${{ github.event.pull_request && format('Pull Request: #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) }}

            For more details, please check:
            - GitHub Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            ${{ github.event.pull_request.html_url && format('- Pull Request: {0}', github.event.pull_request.html_url) }}

      - name: ❌ Mark workflow failed on pnpm policy failure
        if: steps.pnpm-policy.outcome == 'failure'
        run: exit 1
